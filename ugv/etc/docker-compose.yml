# UGV PX4 SITL + Gazebo (headless) — 거점별 1대씩
#
# UGV 1대 = PX4 인스턴스 1개 + Gazebo 1개. 공유하지 않는다.
#   PX4 인스턴스 하나는 기체 하나다 (에어프레임·EKF·파라미터가 프로세스 단위).
#   Gazebo 는 GZ_PARTITION 으로 갈라 서로 안 보이는 별개 시뮬레이션으로 둔다
#   (팀 결정: 차량당 Gazebo 1개, 차량 간 상호작용 없음).
#
# 기동은 ./px4-start.sh 를 쓴다. `docker compose up -d` 만으로는
# 부팅 후 EKF 수렴 대기와 MAVLink 수신 확인이 빠진다 (README 참조).
#
# 프로파일로 대수를 고른다 — 안 띄운 자원은 ugv/fleet.py 가 SimDriver 로 돌린다.
#   docker compose --profile a up -d        A 거점만 (기본 권장)
#   docker compose --profile all up -d      A + B
#
# 실측 (4 vCPU, 30초 평균): PX4 12% + Gazebo 38% = 1대당 약 50%.
# UAV(kangwon 지형) 57% 와 합쳐 2대 구성이 약 107%/400%.

services:
  # --- A 거점 (원통119) -------------------------------------------------
  ugv0:
    image: px4io/px4-sitl-gazebo:latest
    container_name: px4-ugv0
    profiles: ["a", "all"]

    # 필수. `-p 14541:14541/udp` 는 동작하지 않는다 (UAV NOTE.md 2-3 과 같은 이유).
    #   1. PX4 는 컨테이너 내부 127.0.0.1 로만 MAVLink 를 보낸다.
    #   2. docker-proxy 가 포트를 점유해 바인딩이 어긋난다.
    network_mode: host
    restart: unless-stopped

    # `-d` = daemon mode, `-i 1` = 인스턴스 번호.
    #   -d 가 없으면 PX4 가 `pxh> ` 프롬프트를 초당 ~830 KB 쏟아내고, 그 전량이
    #   dockerd/containerd-shim 을 거치며 CPU 1 코어를 통째로 태운다
    #   (UAV 에서 실측: px4 프로세스 110% → 13%). logging 제한은 디스크만 지킬 뿐
    #   이 CPU 낭비는 못 막는다.
    #   -i 는 MAVLink 포트를 정한다: 14540 + i. UAV 가 14540 을 쓰므로 UGV 는 1 부터.
    command: ["-d", "-i", "1"]

    environment:
      HEADLESS: "1"
      PX4_SYS_AUTOSTART: "4009"          # 이미지에 포함된 4009_gz_r1_rover 에어프레임
      PX4_SIM_MODEL: gz_r1_rover
      # 홈 = ugv/data/road_network.json 의 bases.A (원통119). 정본은 그 파일이다.
      PX4_HOME_LAT: "38.1155"
      PX4_HOME_LON: "128.1566"
      # ⚠️ 0 이어야 한다. rover.sdf 지면이 0m 이므로 235 를 주면 PX4 가
      #    235m 상공에 있다고 믿고 Takeoff 를 시도한다 (ugv/tools/px4-start.sh 주석).
      PX4_HOME_ALT: "0"
      PX4_GZ_MODEL_POSE: "0,0,0,0,0,0"   # 월드 원점. 차량마다 world 가 따로라 겹치지 않는다
      # Gazebo 통신 네임스페이스. 이게 달라야 두 시뮬레이션이 서로 안 보인다.
      GZ_PARTITION: ugv0
      GZ_IP: 127.0.0.1                   # 없으면 multicast 로 나가려다 실패하는 환경이 있다

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "2"

  # --- B 거점 (기린119) -------------------------------------------------
  # A 와 다른 것: 인스턴스 번호(→ 포트 14542), 홈 좌표, GZ_PARTITION, 컨테이너 이름.
  ugv1:
    image: px4io/px4-sitl-gazebo:latest
    container_name: px4-ugv1
    profiles: ["all"]

    network_mode: host
    restart: unless-stopped
    command: ["-d", "-i", "2"]

    environment:
      HEADLESS: "1"
      PX4_SYS_AUTOSTART: "4009"
      PX4_SIM_MODEL: gz_r1_rover
      # 홈 = road_network.json 의 bases.B (기린119)
      PX4_HOME_LAT: "37.943"
      PX4_HOME_LON: "128.276"
      PX4_HOME_ALT: "0"
      PX4_GZ_MODEL_POSE: "0,0,0,0,0,0"
      GZ_PARTITION: ugv1
      GZ_IP: 127.0.0.1

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "2"
