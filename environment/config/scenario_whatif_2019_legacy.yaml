# ============================================================================
# Dedicated Legacy Scenario Configuration: 2019 Inje "What-If" Counterfactual
# ============================================================================
# Reproduces the exact environment & CA parameters used when
# web/static/inje2019/scenario.json was generated by tools/inje2019_whatif.py:
# - Baseline literature CA parameters (base_spread=0.40, burn_duration=5)
# - No road blocking (roads_block_spread: false)
# - Baseline GIS rasters in data/processed/ (fuel_type.tif, roads_raster.tif)
# - Fixed weather mode driven by ContractEnvironment's KmaWindDriver (hourly ASOS)
# - Meteorological "from" wind convention
# ============================================================================

raster_paths:
  dem_path: "data/processed/dem_clipped.tif"
  slope_path: "data/processed/slope_5186.tif"
  aspect_path: "data/processed/aspect_5186.tif"
  fuel_path: "data/processed/fuel_type.tif"
  roads_path: "data/processed/roads_raster.tif"
  buildings_path: "data/processed/buildings_inje.tif"

grid:
  crs: "EPSG:5186"
  cell_resolution_m: 90.0
  origin_x: 298096.0
  origin_y: 591533.0

fuel_mapping:
  fuel_type_to_amount:
    0: 0.0
    1: 0.3
    2: 0.6
    3: 1.0
  default_fuel_amount: 0.0
  nodata_strategy: "barrier"

simulation:
  start_time: "2019-04-04T14:45:00"
  end_time: "2019-04-06T12:05:00"
  timestep_minutes: 35
  random_seed: 9

defaults:
  moisture: 0.2

wind:
  speed_ms: 5.0
  direction_deg: 270

weather:
  mode: "fixed"
  wind_direction_convention: "from"

fire_ca:
  base_spread_probability: 0.40
  burn_duration_steps: 5
  slope_factor_weight: 0.05
  wind_factor_weight: 0.1
  moisture_dampening_weight: 1.0
  neighbor_mode: "8-neighbor"
  roads_block_spread: false

risk_scoring:
  burning_cell_risk: 1.0
  burned_cell_risk: 0.2
  unburned_cell_base_risk: 0.0
  downwind_buffer_cells: 3
  downwind_risk_weight: 0.4
  slope_risk_weight: 0.2
  max_slope_degrees: 45.0
  downwind_dot_threshold: 0.3
  fuel_risk_weight: 0.2
  min_risk_score: 0.0
  max_risk_score: 1.0
